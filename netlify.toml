[build]
  publish = "build"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Set charset for HTML files (required by Lighthouse)
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Set charset for root/index page (required by Lighthouse)
[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    # Prevent app shell from being cached (fixes mobile stuck on old SW/cached app)
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# App shell: never cache index.html so users don't get stuck on old service worker / cached app
[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# Clear-cache page: always fetch from network so users can escape stuck old app
[[headers]]
  for = "/clear-cache.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# Escape-hatch paths (same as clear-cache): no-store so old SW doesn't serve cached response
[[headers]]
  for = "/fix-mobile"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"
[[headers]]
  for = "/reset-app"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "no-store, no-cache, must-revalidate"
    Pragma = "no-cache"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Force HTTPS connections (1 year)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    
    # Additional XSS protection (though CSP is better)
    X-XSS-Protection = "1; mode=block"
    
    # Control browser features and APIs
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(self \"https://www.youtube.com\" \"https://youtube.com\"), gyroscope=(self \"https://www.youtube.com\" \"https://youtube.com\"), accelerometer=(self \"https://www.youtube.com\" \"https://youtube.com\")"
    
    # Prevent browsers from detecting the MIME type
    X-Download-Options = "noopen"
    
    # Content Security Policy (moved from meta tag to HTTP header for better security)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://plausible.io https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://www.youtube.com https://youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://betteraibots.com https://www.google-analytics.com https://www.googletagmanager.com https://i.ytimg.com https://img.youtube.com; connect-src 'self' https://www.google-analytics.com https://plausible.io https://*.auth0.com https://*.auth0.com/* https://www.youtube.com https://youtube.com; frame-src 'self' https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://www.youtube.com https://youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    
    # Light caching for better user experience
    Cache-Control = "public, max-age=300, must-revalidate"
    Pragma = "public"

# Specific headers for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Headers for images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.gif"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

# Headers for CSS and JS files
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Headers for fonts
[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.eot"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    X-Content-Type-Options = "nosniff"

# Headers for manifest and service worker
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"

# Search-engine crawlers only: serve pre-rendered HTML with full article text.
# Real visitors always get the React app (header, footer, normal pages) via public/_redirects.
[[redirects]]
  from = "/learn/:id"
  to = "/learn/:id.html"
  status = 200
  conditions = {User-Agent = ["Googlebot", "AdsBot-Google", "Mediapartners-Google", "bingbot", "Baiduspider", "YandexBot", "DuckDuckBot", "Slurp", "ia_archiver", "facebookexternalhit", "Facebot", "Twitterbot", "LinkedInBot", "Applebot", "GPTBot", "ChatGPT-User", "anthropic-ai", "Claude-Web", "PerplexityBot", "Bytespider"]}

[[redirects]]
  from = "/news/:slug"
  to = "/news/:slug.html"
  status = 200
  conditions = {User-Agent = ["Googlebot", "AdsBot-Google", "Mediapartners-Google", "bingbot", "Baiduspider", "YandexBot", "DuckDuckBot", "Slurp", "ia_archiver", "facebookexternalhit", "Facebot", "Twitterbot", "LinkedInBot", "Applebot", "GPTBot", "ChatGPT-User", "anthropic-ai", "Claude-Web", "PerplexityBot", "Bytespider"]}
