<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - BetterAiBots.com</title>
    <meta name="description" content="Clear your browser cache to fix white screen issues on BetterAiBots.com">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #36ff95;
            box-shadow: 0 0 30px rgba(54, 255, 149, 0.2);
        }
        h1 {
            color: #36ff95;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 20px;
            line-height: 1.6;
        }
        button {
            background: linear-gradient(135deg, #36ff95, #0bbfdb);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(54, 255, 149, 0.3);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .success {
            background: rgba(54, 255, 149, 0.1);
            border: 1px solid #36ff95;
            color: #36ff95;
        }
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Clear Cache</h1>
        <p>If you're experiencing white screens or loading issues on BetterAiBots.com, this page will help clear your browser cache and fix the problem.</p>
        
        <button onclick="clearCache()">Clear Cache & Reload</button>
        <button onclick="window.location.href='/'">Go to Homepage</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        async function clearCache() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = 'status';
            statusDiv.textContent = 'Clearing cache...';
            
            try {
                // Clear service worker cache
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(
                        cacheNames.map(name => caches.delete(name))
                    );
                }
                
                // Clear localStorage
                localStorage.clear();
                
                // Clear sessionStorage
                sessionStorage.clear();
                
                // Unregister service worker
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(
                        registrations.map(registration => registration.unregister())
                    );
                }
                
                statusDiv.className = 'status success';
                statusDiv.textContent = '✅ Cache cleared successfully! Redirecting to homepage...';
                
                // Redirect to homepage after 2 seconds
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
                
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '❌ Error clearing cache: ' + error.message;
            }
        }
        
        // Auto-clear cache on page load
        window.addEventListener('load', () => {
            setTimeout(clearCache, 1000);
        });
    </script>
</body>
</html>
