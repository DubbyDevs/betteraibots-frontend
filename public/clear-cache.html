<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>Clearing Cache - BetterAiBots</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
        color: #e5f6ef;
        font-family: "Poppins", Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        background: rgba(16, 28, 38, 0.9);
        border: 1px solid rgba(54, 255, 149, 0.25);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 12px;
        color: #36ff95;
      }
      p {
        margin: 0;
        color: #9ca3af;
        font-size: 0.98rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Clearing cache…</h1>
      <p>Removing old app data and service worker.</p>
      <p style="margin-top:12px;font-size:0.9rem;color:#36ff95;" id="countdown">Redirecting in <strong>10</strong> seconds…</p>
      <p style="margin-top:12px;font-size:0.85rem;color:#6b7280;">Waiting so the service worker and caches are fully removed before loading the site.</p>
      <p style="margin-top:8px;font-size:0.8rem;color:#4b5563;">If it loops again, type in the address bar: <strong>betteraibots.com/reset-app</strong></p>
    </div>
    <script>
      (async function clearCacheAndRedirect() {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) await regs[i].unregister();
          }
          if ('caches' in window) {
            var names = await caches.keys();
            for (var j = 0; j < names.length; j++) await caches.delete(names[j]);
          }
          try { localStorage.clear(); } catch (e) {}
          try { sessionStorage.clear(); } catch (e) {}
        } catch (e) {}
        var sec = 10;
        var el = document.getElementById('countdown');
        var tick = setInterval(function() {
          sec--;
          if (el) el.innerHTML = 'Redirecting in <strong>' + sec + '</strong> second' + (sec !== 1 ? 's' : '') + '…';
          if (sec <= 0) {
            clearInterval(tick);
            var u = new URL('/', window.location.origin);
            u.searchParams.set('nocache', Date.now());
            window.location.href = u.toString();
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
