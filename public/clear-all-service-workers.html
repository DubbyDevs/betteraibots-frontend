<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear All Service Workers - Universal Tool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #36ff95;
            box-shadow: 0 0 30px rgba(54, 255, 149, 0.2);
        }
        h1 {
            color: #36ff95;
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #9ca3af;
        }
        button {
            background: linear-gradient(135deg, #36ff95, #0bbfdb);
            color: #1a2330;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(54, 255, 149, 0.3);
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .success {
            background: rgba(54, 255, 149, 0.1);
            border: 1px solid #36ff95;
            color: #36ff95;
        }
        .info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid #3b82f6;
            color: #3b82f6;
        }
        .list {
            text-align: left;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .list-item {
            padding: 5px 0;
            color: #9ca3af;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Clear All Service Workers</h1>
        <p>This tool will unregister ALL service workers and clear ALL caches for localhost. Use this if you're seeing the wrong app's loading screen on your projects.</p>
        
        <div id="status" class="status"></div>
        
        <div id="sw-list" class="list" style="display: none;">
            <strong style="color: #36ff95;">Found Service Workers:</strong>
            <div id="sw-items"></div>
        </div>
        
        <button onclick="listServiceWorkers()">List Service Workers</button>
        <button onclick="clearAll()">Clear All Service Workers & Caches</button>
        <button onclick="window.location.href='/'">Go to Homepage</button>
    </div>

    <script>
        async function listServiceWorkers() {
            const statusDiv = document.getElementById('status');
            const listDiv = document.getElementById('sw-list');
            const itemsDiv = document.getElementById('sw-items');
            
            statusDiv.style.display = 'block';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Checking for service workers...';
            
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    
                    if (registrations.length === 0) {
                        statusDiv.className = 'status success';
                        statusDiv.textContent = '✅ No service workers found!';
                        listDiv.style.display = 'none';
                    } else {
                        statusDiv.className = 'status info';
                        statusDiv.textContent = `Found ${registrations.length} service worker(s):`;
                        listDiv.style.display = 'block';
                        itemsDiv.innerHTML = '';
                        
                        registrations.forEach((reg, index) => {
                            const item = document.createElement('div');
                            item.className = 'list-item';
                            item.textContent = `${index + 1}. ${reg.scope}`;
                            itemsDiv.appendChild(item);
                        });
                    }
                } else {
                    statusDiv.className = 'status success';
                    statusDiv.textContent = '✅ Service workers not supported in this browser.';
                    listDiv.style.display = 'none';
                }
            } catch (error) {
                statusDiv.className = 'status';
                statusDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                statusDiv.style.border = '1px solid #ef4444';
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = '❌ Error: ' + error.message;
                listDiv.style.display = 'none';
            }
        }
        
        async function clearAll() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = 'status info';
            statusDiv.textContent = 'Clearing service workers and caches...';
            
            try {
                let clearedSW = 0;
                let clearedCaches = 0;
                
                // Clear service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        const success = await registration.unregister();
                        if (success) clearedSW++;
                    }
                }
                
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(
                        cacheNames.map(name => {
                            clearedCaches++;
                            return caches.delete(name);
                        })
                    );
                }
                
                // Clear storage
                localStorage.clear();
                sessionStorage.clear();
                
                statusDiv.className = 'status success';
                statusDiv.textContent = `✅ Cleared ${clearedSW} service worker(s) and ${clearedCaches} cache(s). Reloading page...`;
                
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
                
            } catch (error) {
                statusDiv.className = 'status';
                statusDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                statusDiv.style.border = '1px solid #ef4444';
                statusDiv.style.color = '#ef4444';
                statusDiv.textContent = '❌ Error: ' + error.message;
            }
        }
        
        // Auto-list on load
        window.addEventListener('load', () => {
            setTimeout(listServiceWorkers, 500);
        });
    </script>
</body>
</html>
