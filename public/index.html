    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J3TD7Y2P7M" onerror="this.onerror=null;"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      try {
        gtag('js', new Date());
        gtag('config', 'G-J3TD7Y2P7M');
      } catch(e) {
        // Silently fail if gtag is not available
      }
      
      // Clear very old caches on page load to prevent white screens
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) {
            // Only clear old v1.x caches, let service worker handle v2.x cache cleanup
            if (name.startsWith('betteraibots-v1.')) {
              caches.delete(name);
            }
          }
        });
      }
    </script>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Loading fallback to prevent blank white screen -->
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #36ff95;
        font-family: 'Poppins', sans-serif;
        z-index: 9999;
      ">
        <div style="
          width: 60px;
          height: 60px;
          border: 3px solid rgba(54, 255, 149, 0.3);
          border-top: 3px solid #36ff95;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "></div>
        <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px;">BetterAiBots</div>
        <div style="font-size: 0.9rem; color: #9ca3af;">Loading AI tools...</div>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    
    <!-- Error handling script -->
    <script>
      // Suppress console errors from external services (503s, network failures)
      const originalError = console.error;
      console.error = function(...args) {
        const errorMsg = args.join(' ');
        // Suppress known external service errors that don't affect functionality
        if (errorMsg.includes('fonts.googleapis.com') || 
            errorMsg.includes('googletagmanager.com') ||
            errorMsg.includes('Failed to load resource') ||
            errorMsg.includes('503')) {
          return; // Don't log these errors
        }
        originalError.apply(console, args);
      };
      
      // Hide loading screen when React app loads
      let reactLoaded = false;
      let loadingTimeout;
      
      // Check if React has mounted by looking for the root element content
      function checkReactLoaded() {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const firstChild = root.children[0];
          // Check if React has rendered (not just the loading div)
          if (firstChild && !firstChild.style.background && firstChild.querySelector) {
            reactLoaded = true;
            const loadingElement = document.querySelector('#root > div[style*="background"]');
            if (loadingElement) {
              loadingElement.style.display = 'none';
            }
            if (loadingTimeout) clearTimeout(loadingTimeout);
            return true;
          }
        }
        return false;
      }
      
      // Check immediately and periodically
      window.addEventListener('load', function() {
        // Check every 500ms for React to load
        const checkInterval = setInterval(function() {
          if (checkReactLoaded()) {
            clearInterval(checkInterval);
          }
        }, 500);
        
        // If React hasn't loaded after 10 seconds, show error and offer to clear cache
        loadingTimeout = setTimeout(function() {
          if (!reactLoaded && !checkReactLoaded()) {
            clearInterval(checkInterval);
            const root = document.getElementById('root');
            if (root) {
              root.innerHTML = `
                <div style="
                  position: fixed;
                  top: 0;
                  left: 0;
                  width: 100%;
                  height: 100%;
                  background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  justify-content: center;
                  color: #36ff95;
                  font-family: 'Poppins', sans-serif;
                  text-align: center;
                  padding: 20px;
                  z-index: 99999;
                ">
                  <div style="font-size: 1.5rem; font-weight: 600; margin-bottom: 20px;">App Not Loading</div>
                  <div style="font-size: 1rem; color: #9ca3af; margin-bottom: 30px; max-width: 400px;">
                    The app may be stuck due to cached files. Try clearing the cache and reloading.
                  </div>
                  <button onclick="clearCacheAndReload()" style="
                    background: linear-gradient(135deg, #36ff95, #0bbfdb);
                    color: #1a2330;
                    border: none;
                    padding: 12px 24px;
                    border-radius: 8px;
                    font-weight: 600;
                    cursor: pointer;
                    font-family: 'Poppins', sans-serif;
                    margin-bottom: 15px;
                  ">Clear Cache & Reload</button>
                  <button onclick="window.location.reload()" style="
                    background: rgba(255, 255, 255, 0.1);
                    color: #9ca3af;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    padding: 12px 24px;
                    border-radius: 8px;
                    font-weight: 600;
                    cursor: pointer;
                    font-family: 'Poppins', sans-serif;
                  ">Just Reload</button>
                </div>
              `;
            }
          }
        }, 10000);
      });
      
      // Function to clear cache and reload
      window.clearCacheAndReload = async function() {
        try {
          // Clear service workers
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (let registration of registrations) {
              await registration.unregister();
            }
          }
          
          // Clear all caches
          if ('caches' in window) {
            const cacheNames = await caches.keys();
            await Promise.all(cacheNames.map(name => caches.delete(name)));
          }
          
          // Clear storage
          localStorage.clear();
          sessionStorage.clear();
          
          // Reload
          window.location.reload();
        } catch (error) {
          console.error('Error clearing cache:', error);
          window.location.reload();
        }
      };
      
      // Handle JavaScript errors
      window.addEventListener('error', function(e) {
        // Suppress external resource loading errors
        if (e.target && (e.target.tagName === 'LINK' || e.target.tagName === 'SCRIPT')) {
          if (e.target.src && (e.target.src.includes('fonts.googleapis.com') || 
                               e.target.src.includes('googletagmanager.com'))) {
            e.preventDefault();
            return false;
          }
        }
        if (e.filename && (e.filename.includes('fonts.googleapis.com') || 
                           e.filename.includes('googletagmanager.com'))) {
          e.preventDefault();
          return false;
        }
        console.error('Global error:', e.error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              color: #ff6b6b;
              font-family: 'Poppins', sans-serif;
              text-align: center;
              padding: 20px;
            ">
              <div style="font-size: 1.5rem; font-weight: 600; margin-bottom: 20px;">Something went wrong</div>
              <div style="font-size: 1rem; color: #9ca3af; margin-bottom: 30px;">Please refresh the page to try again</div>
              <button onclick="window.location.reload()" style="
                background: linear-gradient(135deg, #36ff95, #0bbfdb);
                color: #1a2330;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                font-family: 'Poppins', sans-serif;
              ">Refresh Page</button>
            </div>
          `;
        }
      });
    </script>
