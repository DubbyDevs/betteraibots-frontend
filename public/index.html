  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Loading fallback to prevent blank white screen -->
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #36ff95;
        font-family: 'Poppins', sans-serif;
        z-index: 9999;
      ">
        <div style="
          width: 60px;
          height: 60px;
          border: 3px solid rgba(54, 255, 149, 0.3);
          border-top: 3px solid #36ff95;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 20px;
        "></div>
        <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 10px;">BetterAiBots</div>
        <div style="font-size: 0.9rem; color: #9ca3af;">Loading AI tools...</div>
      </div>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
    
    <!-- Error handling script -->
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          const loadingElement = document.querySelector('#root > div');
          if (loadingElement && loadingElement.style.background) {
            loadingElement.style.display = 'none';
          }
        }, 1000);
      });
      
      // Handle JavaScript errors
      window.addEventListener('error', function(e) {
        console.error('Global error:', e.error);
        const root = document.getElementById('root');
        if (root) {
          root.innerHTML = `
            <div style="
              position: fixed;
              top: 0;
              left: 0;
              width: 100%;
              height: 100%;
              background: linear-gradient(135deg, #1a2330 0%, #0f1419 100%);
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              color: #ff6b6b;
              font-family: 'Poppins', sans-serif;
              text-align: center;
              padding: 20px;
            ">
              <div style="font-size: 1.5rem; font-weight: 600; margin-bottom: 20px;">Something went wrong</div>
              <div style="font-size: 1rem; color: #9ca3af; margin-bottom: 30px;">Please refresh the page to try again</div>
              <button onclick="window.location.reload()" style="
                background: linear-gradient(135deg, #36ff95, #0bbfdb);
                color: #1a2330;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                font-family: 'Poppins', sans-serif;
              ">Refresh Page</button>
            </div>
          `;
        }
      });
    </script>
