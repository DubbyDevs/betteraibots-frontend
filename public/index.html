<!DOCTYPE html>
<html lang="en">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('baib-theme');
        var theme = (t === 'dark' || t === 'light') ? t : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#101c26');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <head><meta charset="utf-8">

    <!-- ✅ App Icon for iOS Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- ✅ Favicon -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Fonts - Load asynchronously via JavaScript to prevent 503 errors from blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Load Google Fonts asynchronously to prevent 503 errors from blocking page load
      (function() {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap&font-display=swap';
        link.onerror = function() {
          this.onerror = null;
          // Silently fail - browser will use fallback fonts from CSS
        };
        document.head.appendChild(link);
      })();
    </script>

    <!-- Viewport & Theme Colors -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />

    <meta name="author" content="BetterAiBots.com" />

  <body style="margin:0;">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script>
      (function() {
        window.__lastError = '';
        window.addEventListener('error', function(e) {
          if (e.message) window.__lastError = (window.__lastError || '') + ' ' + e.message;
          if (e.error && e.error.stack) window.__lastError = (window.__lastError || '') + ' ' + e.error.stack;
        });
        window.addEventListener('unhandledrejection', function(e) {
          var msg = e.reason && (e.reason.message || String(e.reason));
          if (msg) window.__lastError = (window.__lastError || '') + ' ' + msg;
        });
        setTimeout(function() {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0 || (root.children.length === 1 && !root.querySelector('a, button, [class]'))) {
            root.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#9ca3af;max-width:400px;margin:0 auto;text-align:center;">' +
              '<p style="color:#36ff95;font-size:1.1rem;">App didn\'t load.</p>' +
              '<p style="margin:12px 0;">On mobile, type in your <strong>address bar</strong>:</p>' +
              '<p style="word-break:break-all;color:#fff;margin:16px 0;">betteraibots.com/reset-app</p>' +
              '<p style="font-size:0.85rem;">Then wait 10 seconds and you\'ll be redirected back.</p>' +
              (window.__lastError ? '<pre style="text-align:left;font-size:0.75rem;overflow:auto;max-height:120px;background:#0f1419;padding:12px;border-radius:8px;margin-top:16px;">' + String(window.__lastError).slice(0,500) + '</pre>' : '') +
              '</div>';
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
